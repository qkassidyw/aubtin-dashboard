name: Daily Fireflies Sync

on:
  schedule:
    - cron: '0 1 * * *'  # 1 AM UTC daily
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Sync Fireflies calls
        run: node scripts/sync-fireflies.js
        env:
          FIREFLIES_TOKEN: ${{ secrets.FIREFLIES_TOKEN }}
      
      - name: Process calls and generate metrics
        run: node scripts/process-calls.js
      
      - name: Commit and push updates
        run: |
          git config user.name "Knox Dashboard Bot"
          git config user.email "knox@apex.host"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily sync: $(date +%Y-%m-%d)" && git push)
